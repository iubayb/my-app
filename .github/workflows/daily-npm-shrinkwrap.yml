name: Daily npm shrinkwrap update
on:
  schedule:
    # Run at 1:00 AM UTC every day
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  update-shrinkwrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '21' 
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate/Update npm shrinkwrap
        run: npm shrinkwrap
        
      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet npm-shrinkwrap.json || echo "changes=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add npm-shrinkwrap.json
          git commit -m "chore: update npm-shrinkwrap.json"
          git push